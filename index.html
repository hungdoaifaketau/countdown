<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bao Tran</title>

    <!-- Christmas Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link href="styles.css" rel="stylesheet">
</head>

<body>

    <!-- Background Video -->
    <video id="video-bg" autoplay muted loop playsinline>
        <source src="ben.mp4" type="video/mp4">
    </video>

    <!-- Santa -->
    <img
        id="santa-gif"
        src="https://th.bing.com/th/id/R.b38cd35700d55700f3e5908abbb8f49e?rik=PqpMPGGsaL%2b2jQ&riu=http%3a%2f%2fimg2.wikia.nocookie.net%2f__cb20121222014341%2faustinally%2fimages%2fe%2fe3%2fSanta_in_his_sleigh.gif&ehk=%2bYcOy%2fzIaAjhVvc420AeY27xAZPr8BFqFUA5enHAKZA%3d&risl=&pid=ImgRaw&r=0"
        alt="Santa in Sleigh"
    />

    <!-- Top Branches -->
    <div class="branches">
        <img id="branch1" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch2" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch3" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch4" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch5" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch6" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
        <img id="branch7" src="https://www.pngmart.com/files/13/Christmas-Branches-PNG-Photos.png">
    </div>

    <!-- Header Balls -->
    <div class="header-balls-div">
        <img class="header-balls ball1" src="https://pluspng.com/img-png/christmas-ball-png-download-christmas-ball-png-images-transparent-gallery-advertisement-1258.png">
        <img class="header-balls ball2" src="https://www.pngall.com/wp-content/uploads/5/Plain-Christmas-Ball-PNG.png">
        <img class="header-balls ball3" src="https://static.vecteezy.com/system/resources/previews/014/576/874/large_2x/metallic-christmas-ball-free-png.png">
        <img class="header-balls ball4" src="https://static.vecteezy.com/system/resources/previews/014/576/862/large_2x/metallic-christmas-ball-free-png.png">
        <img class="header-balls ball5" src="https://pluspng.com/img-png/christmas-ball-png-download-christmas-ball-png-images-transparent-gallery-advertisement-1258.png">
    </div>

    <!-- Countdown -->
    <section class="Countdown">
        <h1 class="Countdown-title">Countdown to Bao Tran birthday</h1>

        <div class="Countdown-display">
            <div class="Countdown-time">
                <div class="box">
                    <div class="Countdown-time-value" id="days">0</div>
                </div>
                <div class="Countdown-time-label">Days</div>
            </div>

            <div class="Countdown-time">
                <div class="box">
                    <div class="Countdown-time-value" id="hours">0</div>
                </div>
                <div class="Countdown-time-label">Hours</div>
            </div>

            <div class="Countdown-time">
                <div class="box">
                    <div class="Countdown-time-value" id="minutes">0</div>
                </div>
                <div class="Countdown-time-label">Minutes</div>
            </div>

            <div class="Countdown-time">
                <div class="box">
                    <div class="Countdown-time-value" id="seconds">0</div>
                </div>
                <div class="Countdown-time-label">Seconds</div>
            </div>
        </div>
    </section>

    <!-- Decorations -->
    <img src="https://clipground.com/images/birthday-gift-box-png-18.png" class="presents">
    <img src="https://clipart.info/images/ccovers/1509729260hd-christmas-fir-tree-png-image.png" class="fur-branch">

    <!-- JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
